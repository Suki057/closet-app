<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Suki 玻璃徽章图标">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1430"/>
      <stop offset="0.5" stop-color="#0c0a16"/>
      <stop offset="1" stop-color="#050409"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.45" stop-color="#F4C24E"/>
      <stop offset="1" stop-color="#D99A2E"/>
    </linearGradient>
    <linearGradient id="irid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8FD6"/>
      <stop offset="0.3" stop-color="#79E6FF"/>
      <stop offset="0.55" stop-color="#B79BFF"/>
      <stop offset="0.8" stop-color="#8BFFCB"/>
      <stop offset="1" stop-color="#FF8FD6"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.32" cy="0.22" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="moonL">
      <rect x="0" y="0" width="512" height="512" fill="#fff"/>
      <circle cx="214" cy="312" r="21" fill="#000"/>
    </mask>
    <mask id="moonR">
      <rect x="0" y="0" width="512" height="512" fill="#fff"/>
      <circle cx="298" cy="312" r="21" fill="#000"/>
    </mask>
    <g id="spark">
      <path d="M0,-13 C2,-3.5 3.5,-2 13,0 C3.5,2 2,3.5 0,13 C-2,3.5 -3.5,2 -13,0 C-3.5,-2 -2,-3.5 0,-13 Z"/>
    </g>
  </defs>

  <!-- 玻璃胶囊外框：深色光泽底 -->
  <rect x="6" y="6" width="500" height="500" rx="150" ry="150" fill="url(#bg)"/>

  <!-- 虹彩玻璃描边（双层：外发光 + 实边） -->
  <rect x="20" y="20" width="472" height="472" rx="140" ry="140" fill="none"
        stroke="url(#irid)" stroke-width="14" opacity="0.55" filter="url(#glow)"/>
  <rect x="20" y="20" width="472" height="472" rx="140" ry="140" fill="none"
        stroke="url(#irid)" stroke-width="9"/>
  <rect x="34" y="34" width="444" height="444" rx="128" ry="128" fill="none"
        stroke="#ffffff" stroke-width="1.5" opacity="0.22"/>

  <!-- 顶部高光 -->
  <rect x="6" y="6" width="500" height="500" rx="150" ry="150" fill="url(#gloss)"/>

  <!-- 金色 Suki 图腾 -->
  <g fill="none" stroke="url(#gold)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- 上三角 -->
    <path d="M256 150 L165 332 L347 332 Z"/>
    <!-- 内圆 -->
    <circle cx="256" cy="248" r="53"/>
  </g>

  <!-- 中心小星 -->
  <g fill="url(#gold)">
    <use href="#spark" transform="translate(256 248) scale(1.0)"/>
    <use href="#spark" transform="translate(214 196) scale(0.55)"/>
    <use href="#spark" transform="translate(298 196) scale(0.55)"/>
    <use href="#spark" transform="translate(256 132) scale(0.5)"/>
  </g>

  <!-- 两只弯月 -->
  <circle cx="198" cy="312" r="23" fill="url(#gold)" mask="url(#moonL)"/>
  <circle cx="314" cy="312" r="23" fill="url(#gold)" mask="url(#moonR)"/>

  <!-- Suki 文字 -->
  <text x="256" y="398" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', 'Songti SC', serif"
        font-style="italic" font-weight="600" font-size="62"
        letter-spacing="3" fill="url(#gold)">Suki</text>
</svg>
